<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Departures</title>
<meta name="description" content="Live Tube, Elizabeth line, Overground, DLR and tram departures on a dot-matrix board.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Departures">
<style>
  /* UI colours; the board's own dot colours live in THEMES in the script, which sets these too */
  :root {
    --text: #ffb84d; --strong: #ffd27a; --dim: #c98a2a; --muted: #8a6a3a; --faint: #6b5a3c;
    --border: #4a3312; --border-hi: #8a5d1c; --accent: #ffa31a;
    --panel: #0d0802; --hl: #1c1104; --chip-on: #2b1a04;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex;
    align-items: center;
    flex-direction: column;
    justify-content: center;
    font: 14px/1.4 system-ui, sans-serif;
    color: var(--text);
  }
  body.idle { cursor: none; }
  .screen {
    /* fill the display while keeping the board's proportions */
    width: min(96vw, calc(96vh * 192 / 45));
  }
  canvas { display: block; width: 100%; height: auto; }
  /* portrait: the tall board sits at the top, leaving room for the controls underneath */
  body.portrait { box-sizing: border-box; padding: calc(10px + env(safe-area-inset-top)) 0 calc(120px + env(safe-area-inset-bottom)); }
  body.portrait .screen {
    width: min(calc(100vw - 16px), calc((100vh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 88 / 145));
    width: min(calc(100vw - 16px), calc((100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 88 / 145));
  }
  body.portrait #caption { display: none; }

  /* controls: shown only while the pointer is moving */
  .chrome { transition: opacity .4s; }
  body.idle .chrome { opacity: 0; pointer-events: none; }
  body.idle .chrome:focus-within { opacity: 1; pointer-events: auto; }

  #caption {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top));
    left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right));
    margin: 0;
    text-align: center;
    color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #bar {
    position: fixed;
    left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right));
    bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 8px;
  }
  #favs {
    flex: 1; min-width: 0;
    display: flex; gap: 6px;
    overflow-x: auto; scrollbar-width: none;
  }
  #favs::-webkit-scrollbar { display: none; }
  #favs:empty { display: none; }
  /* fade the edge while more favourites are off to the right */
  #favs.more { --fade-r: 32px; }
  #favs.less { --fade-l: 32px; }
  #favs.more, #favs.less {
    -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent);
    mask-image: linear-gradient(to right, transparent, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent);
  }
  #favs .chip { flex: none; }
  /* phones: favourites get their own row above the buttons */
  @media (max-width: 640px) {
    #bar { flex-wrap: wrap; justify-content: flex-end; }
    #favs { flex: 1 0 100%; }
    #status { bottom: calc(108px + env(safe-area-inset-bottom)); }
  }
  button {
    font: inherit; font-size: 13px; line-height: 1.2;
    padding: 6px 11px;
    color: var(--dim);
    background: #000;
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { border-color: var(--border-hi); color: var(--text); }
  button:disabled { opacity: .3; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip[aria-current="true"] { background: var(--chip-on); color: var(--strong); border-color: var(--border-hi); }
  .chip kbd { font: inherit; opacity: .55; margin-right: 6px; }
  #star[aria-pressed="true"], .primary, h3 button[aria-pressed="true"] { color: var(--strong); border-color: var(--border-hi); }

  #status {
    position: fixed;
    left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom));
    margin: 0;
    text-align: center;
    color: var(--faint);
  }
  #status[hidden] { display: none; }

  /* dialogs */
  dialog {
    width: min(560px, calc(100vw - 32px));
    max-height: min(640px, calc(100vh - 32px));
    box-sizing: border-box;
    padding: 0;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .dlg-head {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px 10px;
  }
  .dlg-head h2 { flex: 1; min-width: 0; margin: 0; font-size: 16px; font-weight: 600; color: var(--strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg-search { display: flex; gap: 8px; padding: 0 16px 12px; }
  .dlg-search[hidden] { display: none; }
  input[type="search"], input[type="text"] {
    flex: 1; min-width: 0;
    width: 100%; box-sizing: border-box;
    font: inherit; font-size: 16px;
    padding: 9px 12px;
    color: var(--strong);
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  input::placeholder { color: var(--faint); }
  .dlg-body { overflow-y: auto; padding: 0 8px 12px; }
  .dlg-body h3 {
    display: flex; align-items: center; gap: 8px;
    margin: 12px 8px 6px;
    font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted);
  }
  .dlg-body h3 span { flex: 1; }
  .dlg-body h3 button { font-size: 12px; padding: 2px 9px; letter-spacing: 0; text-transform: none; }
  .dlg-body ul { list-style: none; margin: 0; padding: 0; }
  .row {
    display: flex; align-items: center; gap: 4px;
    border-radius: 6px;
  }
  .row:hover { background: var(--hl); }
  .row .main {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 10px;
    text-align: left;
    padding: 9px 8px;
    border: 0; background: none;
    font-size: 14px;
    color: var(--text);
  }
  .row .main:hover { color: var(--strong); }
  .text { min-width: 0; display: flex; flex-direction: column; }
  .text > span { overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
  .sub { font-size: 12px; color: var(--muted); }
  .row .icon { border: 0; background: none; font-size: 17px; padding: 6px 10px; color: var(--muted); }
  .row .icon[aria-pressed="true"] { color: var(--strong); }
  .swatch { flex: none; width: 4px; align-self: stretch; border-radius: 2px; background: var(--muted); }
  .note { margin: 12px 8px; color: var(--muted); }

  /* favourites in edit mode */
  .fav-edit { display: flex; align-items: center; gap: 8px; padding: 5px 4px 5px 6px; }
  .fav-edit .swatch { height: 30px; align-self: center; }
  .fav-edit input { font-size: 15px; padding: 6px 9px; }
  .fav-edit .icon { border: 0; background: none; font-size: 17px; padding: 6px 8px; color: var(--muted); }
  .arrows { display: flex; flex-direction: column; }
  .arrows button { border: 0; background: none; padding: 1px 6px; font-size: 11px; line-height: 1.1; }

  /* which trains? */
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 8px; border-radius: 6px; cursor: pointer; }
  .opt:has(input:checked) { background: var(--hl); }
  .opt input[type="radio"] { margin: 3px 0 0; accent-color: var(--accent); }
  .opt .text { flex: 1; }
  .via { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .via input { font-size: 15px; padding: 7px 10px; }
  .via ul { display: flex; flex-direction: column; }
  .via li button { width: 100%; text-align: left; border: 0; background: none; padding: 6px 4px; font-size: 14px; color: var(--text); }
  .via li button:hover { color: var(--strong); background: var(--hl); }
  .actions { display: flex; justify-content: flex-end; padding: 8px; }

  /* settings */
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 8px 8px; }
  .theme { display: flex; flex-direction: column; gap: 6px; padding: 8px; text-align: left; border-radius: 6px; }
  .theme[aria-pressed="true"] { border-color: var(--accent); background: var(--hl); color: var(--strong); }
  .theme canvas { border-radius: 2px; }
  .walk { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
  .walk button { font-size: 18px; padding: 4px 14px; }
  .walk output { min-width: 64px; text-align: center; font-size: 16px; color: var(--strong); }
  .rules { display: flex; flex-direction: column; gap: 10px; padding: 0 8px; }
  .rules li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .rules li > select:first-child { flex: 1 1 100%; }
  .rules li .remove { margin-left: auto; border: 0; background: none; font-size: 16px; color: var(--muted); }
  select, input[type="time"] {
    font: inherit; font-size: 14px; padding: 6px 8px;
    color: var(--strong); background: #000; color-scheme: dark;
    border: 1px solid var(--border); border-radius: 6px;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body class="idle">
<p id="caption" class="chrome"></p>
<div class="screen"><canvas id="board" role="img" aria-label="Departure board"></canvas></div>
<p id="status" hidden></p>
<div id="bar" class="chrome">
  <div id="favs" role="toolbar" aria-label="Favourite boards"></div>
  <button id="gear" type="button" aria-label="Settings" title="Settings">⚙</button>
  <button id="star" type="button" aria-pressed="false" hidden>☆ Favourite</button>
  <button id="change" type="button">Change board</button>
</div>

<dialog id="picker" aria-labelledby="picker-title">
  <div class="dlg-head">
    <button id="back" type="button" hidden aria-label="Back">←</button>
    <h2 id="picker-title">Choose a board</h2>
    <button id="close" type="button" aria-label="Close">✕</button>
  </div>
  <div class="dlg-search" id="search-wrap">
    <input id="q" type="search" placeholder="Search for a station" autocomplete="off" aria-label="Station name">
    <button id="near" type="button">◎ Near me</button>
  </div>
  <div class="dlg-body" id="results" aria-live="polite"></div>
</dialog>

<dialog id="settings" aria-labelledby="settings-title">
  <div class="dlg-head">
    <h2 id="settings-title">Settings</h2>
    <button id="settings-close" type="button" aria-label="Close">✕</button>
  </div>
  <div class="dlg-body">
    <h3><span>Colour for this board</span></h3>
    <div class="themes" id="themes" role="group" aria-label="Colour for this board"></div>
    <p class="note" id="theme-note"></p>
    <h3><span id="walk-title">Walking time to this station</span></h3>
    <div class="walk">
      <button id="walk-minus" type="button" aria-label="Less walking time">−</button>
      <output id="walk-value" aria-live="polite">Off</output>
      <button id="walk-plus" type="button" aria-label="More walking time">+</button>
    </div>
    <p class="note">Trains you can’t reach in time are dimmed, and the board tells you when to leave for the next one you can catch.</p>
    <h3><span>Boards by time of day</span><button id="rule-add" type="button">Add</button></h3>
    <ul class="rules" id="rules"></ul>
    <p class="note" id="rules-note"></p>
  </div>
</dialog>
<div class="sr-only" aria-live="polite" id="sr"></div>

<script>
(() => {
  // ---------- 5x7 dot matrix font (8 rows, last row for descenders) ----------
  const F = {
    ' ':[0,0,0,0,0,0,0], '!':[4,4,4,4,0,0,4], '"':[10,10,0,0,0,0,0], "'":[4,4,8,0,0,0,0],
    '(':[2,4,8,8,8,4,2], ')':[8,4,2,2,2,4,8], '+':[0,4,4,31,4,4,0], ',':[0,0,0,0,12,4,8],
    '-':[0,0,0,31,0,0,0], '.':[0,0,0,0,0,12,12], '/':[0,1,2,4,8,16,0], ':':[0,12,12,0,12,12,0],
    '&':[12,18,20,8,21,18,13],
    '0':[14,17,19,21,25,17,14], '1':[4,12,4,4,4,4,14], '2':[14,17,1,2,4,8,31],
    '3':[31,2,4,2,1,17,14], '4':[2,6,10,18,31,2,2], '5':[31,16,30,1,1,17,14],
    '6':[6,8,16,30,17,17,14], '7':[31,1,2,4,8,8,8], '8':[14,17,17,14,17,17,14],
    '9':[14,17,17,15,1,2,12],
    'A':[14,17,17,17,31,17,17], 'B':[30,17,17,30,17,17,30], 'C':[14,17,16,16,16,17,14],
    'D':[28,18,17,17,17,18,28], 'E':[31,16,16,30,16,16,31], 'F':[31,16,16,30,16,16,16],
    'G':[14,17,16,23,17,17,15], 'H':[17,17,17,31,17,17,17], 'I':[14,4,4,4,4,4,14],
    'J':[7,2,2,2,2,18,12], 'K':[17,18,20,24,20,18,17], 'L':[16,16,16,16,16,16,31],
    'M':[17,27,21,21,17,17,17], 'N':[17,17,25,21,19,17,17], 'O':[14,17,17,17,17,17,14],
    'P':[30,17,17,30,16,16,16], 'Q':[14,17,17,17,21,18,13], 'R':[30,17,17,30,20,18,17],
    'S':[15,16,16,14,1,1,30], 'T':[31,4,4,4,4,4,4], 'U':[17,17,17,17,17,17,14],
    'V':[17,17,17,17,17,10,4], 'W':[17,17,17,21,21,21,10], 'X':[17,17,10,4,10,17,17],
    'Y':[17,17,17,10,4,4,4], 'Z':[31,1,2,4,8,16,31],
    'a':[0,0,14,1,15,17,15], 'b':[16,16,22,25,17,17,30], 'c':[0,0,14,16,16,17,14],
    'd':[1,1,13,19,17,17,15], 'e':[0,0,14,17,31,16,14], 'f':[6,9,8,28,8,8,8],
    'g':[0,0,15,17,17,15,1,14], 'h':[16,16,22,25,17,17,17], 'i':[4,0,12,4,4,4,14],
    'j':[2,0,6,2,2,2,18,12], 'k':[16,16,18,20,24,20,18], 'l':[12,4,4,4,4,4,14],
    'm':[0,0,26,21,21,17,17], 'n':[0,0,22,25,17,17,17], 'o':[0,0,14,17,17,17,14],
    'p':[0,0,30,17,17,30,16,16], 'q':[0,0,15,17,17,15,1,1], 'r':[0,0,22,25,16,16,16],
    's':[0,0,14,16,14,1,30], 't':[8,8,28,8,8,9,6], 'u':[0,0,17,17,17,19,13],
    'v':[0,0,17,17,17,10,4], 'w':[0,0,17,17,21,21,10], 'x':[0,0,17,10,4,10,17],
    'y':[0,0,17,17,17,15,1,14], 'z':[0,0,31,2,4,8,31]
  };
  const GLYPH = {};
  for (const [ch, rows] of Object.entries(F)) {
    const r = rows.concat(Array(8 - rows.length).fill(0));
    let left = 5, right = -1;
    r.forEach(v => { for (let c = 0; c < 5; c++) if ((v >> (4 - c)) & 1) { left = Math.min(left, c); right = Math.max(right, c); } });
    if (/[0-9]/.test(ch)) { left = 0; right = 4; }      // tabular digits
    if (ch === ' ') { left = 0; right = 1; }
    GLYPH[ch] = { rows: r, left, width: right - left + 1 };
  }

  // ---------- board geometry ----------
  // Board size in dots: landscape 192x45; portrait uses a taller, narrower board (see Board.layout)
  const LW = 192, LH = 45, ROW_Y = [2, 12, 22, 35];
  let W = LW, H = LH;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function measure(text) {
    let w = 0;
    for (const ch of text) { const g = GLYPH[ch] || GLYPH[' ']; w += g.width + 1; }
    return Math.max(0, w - 1);
  }
  // x0..x1 clips horizontally (for text scrolling inside a space); bw/bh are the buffer's size
  function drawText(buf, text, x, y, x0 = 0, x1 = W, bw = W, bh = H) {
    for (const ch of text) {
      const g = GLYPH[ch] || GLYPH[' '];
      for (let r = 0; r < 8; r++) {
        const v = g.rows[r];
        if (!v) continue;
        for (let c = g.left; c < g.left + g.width; c++) {
          if ((v >> (4 - c)) & 1) {
            const px = x + c - g.left, py = y + r;
            if (px >= x0 && px < x1 && px < bw && py >= 0 && py < bh) buf[py * bw + px] = 1;
          }
        }
      }
      x += g.width + 1;
    }
  }

  // ---------- time helpers (always London time) ----------
  const clockFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const hmFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', hour12: false });

  // ---------- storage ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // ---------- colour themes ----------
  const THEMES = {
    amber: { name: 'Amber', unlit: '#261703', core: ['#ffd27a', '#ffa31a', '#e07b00'], halo: 'rgba(255,150,20,.45)', fade: 'rgba(255,120,0,0)',
             ui: { text: '#ffb84d', strong: '#ffd27a', dim: '#c98a2a', muted: '#8a6a3a', faint: '#6b5a3c', border: '#4a3312', 'border-hi': '#8a5d1c', accent: '#ffa31a', panel: '#0d0802', hl: '#1c1104', 'chip-on': '#2b1a04' } },
    white: { name: 'White LED', unlit: '#1b1b1d', core: ['#ffffff', '#eef3f8', '#b9c4cf'], halo: 'rgba(225,238,255,.38)', fade: 'rgba(200,220,255,0)',
             ui: { text: '#e6ebf0', strong: '#ffffff', dim: '#b9c2cc', muted: '#848d96', faint: '#5d656d', border: '#343a40', 'border-hi': '#6c757d', accent: '#ffffff', panel: '#0b0c0d', hl: '#1a1d20', 'chip-on': '#24282c' } },
    green: { name: 'Green', unlit: '#0b1f07', core: ['#d4ffbf', '#66ff3d', '#2eb812'], halo: 'rgba(90,255,50,.38)', fade: 'rgba(60,220,20,0)',
             ui: { text: '#7dff5a', strong: '#c8ffb0', dim: '#4fc934', muted: '#3f8f2d', faint: '#2f6624', border: '#1d4314', 'border-hi': '#3a7a28', accent: '#66ff3d', panel: '#050c03', hl: '#0d1d08', 'chip-on': '#12290b' } },
    red:   { name: 'Red', unlit: '#260707', core: ['#ffc2b5', '#ff4430', '#c8180b'], halo: 'rgba(255,60,40,.42)', fade: 'rgba(230,30,10,0)',
             ui: { text: '#ff7a66', strong: '#ffb3a6', dim: '#d9503d', muted: '#a04c40', faint: '#6e3b33', border: '#4a1a14', 'border-hi': '#8a2c20', accent: '#ff4430', panel: '#0d0403', hl: '#1d0806', 'chip-on': '#2b0c08' } }
  };
  // Each board can have its own colour (stored on this device, by board); others are amber
  let theme = 'amber';
  const boardThemes = store.get('boardThemes', {});
  function applyTheme() {
    for (const [k, v] of Object.entries(THEMES[theme].ui)) document.documentElement.style.setProperty('--' + k, v);
  }
  applyTheme();

  // Lit dot with a soft halo, drawn once per size and theme
  function dotSprite(t, pitch) {
    const s = Math.ceil(pitch * 3);
    const sprite = document.createElement('canvas');
    sprite.width = sprite.height = s;
    const sc = sprite.getContext('2d');
    const halo = sc.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    halo.addColorStop(0, t.halo);
    halo.addColorStop(1, t.fade);
    sc.fillStyle = halo; sc.fillRect(0, 0, s, s);
    const core = sc.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, pitch * 0.42);
    core.addColorStop(0, t.core[0]);
    core.addColorStop(0.6, t.core[1]);
    core.addColorStop(1, t.core[2]);
    sc.fillStyle = core;
    sc.beginPath(); sc.arc(s / 2, s / 2, pitch * 0.42, 0, Math.PI * 2); sc.fill();
    return sprite;
  }

  // ---------- TfL API ----------
  const API = 'https://api.tfl.gov.uk';
  const MODES = ['tube', 'elizabeth-line', 'overground', 'dlr', 'tram'];
  const TIMETABLED = new Set(['elizabeth-line', 'overground']);   // these also have a scheduled departures feed
  const LINE_COLOURS = {
    bakerloo: '#b36305', central: '#e32017', circle: '#ffd300', district: '#00782a',
    'hammersmith-city': '#f3a9bb', jubilee: '#a0a5a9', metropolitan: '#9b0056', northern: '#000',
    piccadilly: '#003688', victoria: '#0098d4', 'waterloo-city': '#95cdba', elizabeth: '#6950a1',
    dlr: '#00a4a7', tram: '#5fb526', liberty: '#61686b', lioness: '#ef9600', mildmay: '#2774ae',
    suffragette: '#5ba763', weaver: '#893b67', windrush: '#d22730'
  };
  const lineColour = (id, mode) => LINE_COLOURS[id] || (mode === 'overground' ? '#ee7c0e' : '#8a6a3a');

  async function getJSON(path, signal) {
    const res = await fetch(API + path, { cache: 'no-store', signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  const cleanName = n => (n || '')
    .replace(/\s*\((?:London|[^)]*Line)\)/gi, '')
    .replace(/\s+(Rail|Underground|DLR|Tram|Elizabeth line)\s+Station$/i, '')
    .replace(/\s+Station$/i, '').replace(/-Underground$/i, '').trim();
  const shortDest = n => n.replace(/Terminals?\s/, 'T');
  // "Eastbound - Platform 3" -> "Eastbound"; "Platform 3" -> ""
  const boundOf = p => { const m = /^(.+?)\s+-\s+/.exec(p || ''); return m && !/^platform/i.test(m[1]) ? m[1].trim() : ''; };
  const platformOf = p => { const v = (p || '').replace(/^.*?platform\s*/i, '').trim(); return /unknown/i.test(v) ? '' : v; };

  // A board is one station stop, one line and one direction:
  // { naptan, station, stopName, line, lineName, mode, bound | dir, dirLabel, short }
  // "bound" (Eastbound etc.) comes from the platform name where TfL gives one,
  // otherwise "dir" is TfL's inbound/outbound, or "all" at the end of a line
  // where every departure goes the same way.
  // A platform board ("platform" set) instead shows every line in "lines" that uses that platform.
  // Any board can also have "via" ({ naptan, name }): only trains that go on to call there.
  // Favourites may carry their own "name".
  const dirKey = b => b.platform ? 'p:' + b.platform : b.bound ? 'b:' + b.bound : 'd:' + b.dir;
  const linesOf = b => b.lines || [b.line];
  const keyOf = b => `${b.naptan}/${linesOf(b).join('+')}/${dirKey(b)}` + (b.via ? `/via:${b.via.naptan}` : '');
  const tidyPlatform = p => (p || '').replace(/\s+/g, ' ').trim();
  const platformLabel = p => { const bound = boundOf(p), n = platformOf(p); return [bound, n && 'Platform ' + n].filter(Boolean).join(' · '); };
  const SHORT_LINES = { 'hammersmith-city': 'H&C', 'waterloo-city': 'W&C' };
  const shortLine = id => SHORT_LINES[id] || id[0].toUpperCase() + id.slice(1);
  const dirName = d => d === 'all' ? 'All departures' : d[0].toUpperCase() + d.slice(1);
  const titleOf = b => `${b.station} · ${b.lineName} · ${b.dirLabel}` + (b.via ? ` · calling at ${b.via.name}` : '');
  const favName = f => f.name || f.short;

  // Every train on one line at one stop that carries passengers on from there,
  // tagged with the direction key its board uses.
  function servicesAt(naptan, names, line, arrivals, departures) {
    const now = Date.now();
    const terminates = t => t.destinationNaptanId === naptan || names.includes(cleanName(t.destinationName));
    const live = (arrivals || []).filter(t => t.lineId === line && !terminates(t));
    const useBound = live.some(t => boundOf(t.platformName));
    const keyFor = t => useBound ? (boundOf(t.platformName) ? 'b:' + boundOf(t.platformName) : '') : (t.direction ? 'd:' + t.direction : '');

    // Remember which way each destination / platform goes, so the timetable feed
    // (which has no direction of its own) can be sorted even when no live trains are around.
    const mapKey = `dirs2:${naptan}:${line}`;
    const dirs = store.get(mapKey, {});
    for (const t of live) {
      const k = keyFor(t);
      if (!k) continue;
      if (t.destinationNaptanId) dirs['d:' + t.destinationNaptanId] = k;
      const p = platformOf(t.platformName);
      if (p) dirs['p:' + p] = k;
    }
    store.set(mapKey, dirs);

    // The timetable feed has no train IDs; borrow the one from the live prediction for the same train
    const vehicleFor = (t, eta) => {
      let best = null;
      for (const a of live) {
        if (a.destinationNaptanId !== t.destinationNaptanId || !a.vehicleId) continue;
        const d = Math.abs(new Date(a.expectedArrival).getTime() - eta);
        if (d <= 3 * 60e3 && (!best || d < best.d)) best = { d, id: a.vehicleId };
      }
      return best ? best.id : '';
    };

    const out = [];
    if (departures && departures.length) {
      // No known directions here means it's the end of the line: everything leaves the same way
      const known = Object.keys(dirs).length > 0;
      for (const t of departures) {
        if (terminates(t)) continue;
        const key = dirs['d:' + t.destinationNaptanId] || dirs['p:' + platformOf(t.platformName)] || (known ? '' : 'd:all');
        if (!key) continue;
        const sched = new Date(t.scheduledTimeOfDeparture || t.scheduledTimeOfArrival).getTime();
        const eta = new Date(t.estimatedTimeOfDeparture || t.estimatedTimeOfArrival || t.scheduledTimeOfDeparture || t.scheduledTimeOfArrival).getTime();
        out.push({ key, platform: tidyPlatform(t.platformName), dest: cleanName(t.destinationName || 'Check front of train'), eta, sched, vehicle: vehicleFor(t, eta),
                   cancelled: t.departureStatus === 'Cancelled', cause: t.cause });
      }
    } else {
      const seen = new Map();
      for (const t of live) {
        const key = keyFor(t);
        if (!key) continue;
        const dest = cleanName(t.destinationName || 'Check front of train');
        const towards = (t.towards || '').trim();
        const name = towards && towards.toLowerCase().startsWith(dest.toLowerCase()) ? towards : (dest || towards);
        const eta = new Date(t.expectedArrival).getTime();
        if (eta < now - 30e3) continue;
        const id = t.vehicleId && t.vehicleId !== '000' ? t.vehicleId : name + eta;
        if (!seen.has(id) || seen.get(id).eta > eta) seen.set(id, { key, platform: tidyPlatform(t.platformName), dest: name, eta, sched: eta, vehicle: t.vehicleId });
      }
      out.push(...seen.values());
    }
    return out;
  }

  // ---------- board state ----------
  let current = null;
  let data = { trains: [], messages: [], mode: 'idle', updated: 0 };

  function messagesFromStatus(lineStatus) {
    const out = [];
    for (const line of lineStatus || []) {
      for (const st of line.lineStatuses || []) {
        if (st.statusSeverity !== 10 && st.reason) out.push(st.reason.replace(/\s+/g, ' ').trim().replace(/\.$/, ''));
      }
    }
    return out;
  }

  function build(b, arrivals, departures, lineStatus, viaArrivals) {
    const now = Date.now();
    const want = b.platform ? '' : b.bound ? 'b:' + b.bound : 'd:' + b.dir;
    // For a "calling at" board: when each train reaches that station
    let calls = null;
    if (b.via) {
      calls = new Map();
      for (const t of viaArrivals || []) {
        if (!linesOf(b).includes(t.lineId) || !t.vehicleId) continue;
        const at = new Date(t.expectedArrival).getTime();
        if (!calls.has(t.vehicleId) || calls.get(t.vehicleId) > at) calls.set(t.vehicleId, at);
      }
    }
    const trains = [], notices = [];
    const names = [b.station, b.stopName].filter(Boolean);
    const services = linesOf(b).flatMap(line =>
      servicesAt(b.naptan, names, line, arrivals, departures[line]).map(s => ({ ...s, line })));
    for (const s of services) {
      if (b.platform ? s.platform !== b.platform : b.dir !== 'all' && s.key !== want) continue;
      if (calls && !(s.vehicle && calls.get(s.vehicle) > s.eta)) continue;
      if (s.cancelled) {
        if (s.sched > now - 60e3 && s.sched < now + 90 * 60e3) {
          const why = (s.cause || '').replace(/^This service has been cancelled\s*/i, '').replace(/\.$/, '');
          notices.push({ at: s.sched, text: `The ${hmFmt.format(s.sched)} ${s.dest} service is cancelled${why ? ' ' + why : ''}` });
        }
        continue;
      }
      if (s.eta < now - 30e3) continue;
      trains.push({ dest: s.dest, eta: s.eta, line: s.line });
      const late = Math.round((s.eta - s.sched) / 60e3);
      if (late >= 2 && s.eta < now + 60 * 60e3) {
        notices.push({ at: s.sched, text: `The ${hmFmt.format(s.sched)} ${s.dest} service is running ${late} min late` });
      }
    }

    trains.sort((a, b) => a.eta - b.eta);
    // On a shared platform, say which line when two lines go to the same place
    const linesTo = {};
    for (const tr of trains) (linesTo[tr.dest] ||= new Set()).add(tr.line);
    for (const tr of trains) if (linesTo[tr.dest].size > 1) tr.dest += ` (${shortLine(tr.line)})`;
    notices.sort((a, b) => a.at - b.at);
    const messages = [...new Set((b.via ? [`Calling at ${b.via.name}`] : []).concat(notices.map(n => n.text), messagesFromStatus(lineStatus)))].slice(0, 4);
    return { trains, messages, mode: 'live', updated: now };
  }

  async function loadBoard(b) {
    const lines = linesOf(b);
    const [arrivals, deps, lineStatus, viaArrivals] = await Promise.all([
      getJSON(`/StopPoint/${b.naptan}/Arrivals`),
      Promise.all(lines.map(line => TIMETABLED.has(b.mode)
        ? getJSON(`/StopPoint/${b.naptan}/ArrivalDepartures?lineIds=${line}`).catch(() => null) : null)),
      getJSON(`/Line/${lines.join(',')}/Status`).catch(() => []),
      b.via ? getJSON(`/StopPoint/${b.via.naptan}/Arrivals`) : null
    ]);
    const departures = Object.fromEntries(lines.map((line, i) => [line, deps[i]]));
    return build(b, arrivals, departures, lineStatus, viaArrivals);
  }

  async function refresh() {
    const b = current;
    if (!b) return;
    try {
      const next = await loadBoard(b);
      if (current !== b) return;
      data = next;
    } catch (e) {
      if (current !== b) return;
      if (data.mode !== 'live' || Date.now() - data.updated > 3 * 60e3) data = { ...data, mode: 'offline' };
    }
    updateStatus();
    describe();
  }

  function updateStatus() {
    const el = document.getElementById('status');
    el.hidden = data.mode !== 'offline';
    el.textContent = 'Live data unavailable, retrying every 30 seconds.';
  }

  // ---------- rendering ----------
  function minsLabel(eta) {
    const m = Math.round((eta - Date.now()) / 60e3);
    return m <= 0 ? 'Due' : `${m} min`;
  }
  function fitDest(name, maxW) {
    if (measure(name) <= maxW) return name;
    let n = shortDest(name);
    while (measure(n) > maxW && n.length > 1) n = n.slice(0, -1);
    return n.trimEnd();
  }

  // ---------- leave now ----------
  // Walking time to a station, in minutes (0 = off), remembered per station on this device
  const walkTimes = store.get('walkTimes', {});
  const walkFor = b => (b && walkTimes[b.naptan]) || 0;
  const missed = t => t.eta - Date.now() < walkFor(current) * 60e3;
  // Trains to show: with a walking time set, at most one you can no longer catch, then the rest
  function visibleTrains(n) {
    const all = data.trains.filter(t => t.eta > Date.now() - 30e3);
    if (!walkFor(current)) return all.slice(0, n);
    const gone = all.filter(missed);
    return gone.slice(-1).concat(all.filter(t => !missed(t))).slice(0, n);
  }
  function leaveText() {
    const walk = walkFor(current);
    if (!walk) return '';
    const next = data.trains.find(t => !missed(t));
    if (!next) return '';
    const m = Math.floor((next.eta - Date.now()) / 60e3) - walk;
    return m <= 0 ? 'Leave now' : `Leave in ${m} min`;
  }

  const APPROACH_MODES = new Set(['tube', 'dlr']);
  const PORTRAIT_TRAINS = 5, PW = 88, PH = 26 + PORTRAIT_TRAINS * 19 + 24;
  const dateFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', day: 'numeric', month: 'short' });
  const APPROACH_TEXT = 'STAND BACK TRAIN APPROACHING';

  class Board {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.buf = new Uint8Array(W * H);
      this.resetBottom();
      this.layout();
      new ResizeObserver(() => this.resize()).observe(canvas.parentElement);
      addEventListener('resize', () => this.layout());
    }
    // Upright screens get the tall portrait board
    layout() {
      const portrait = innerHeight > innerWidth * 1.15;
      if (portrait === this.portrait) return;
      this.portrait = portrait;
      W = portrait ? PW : LW;
      H = portrait ? PH : LH;
      this.buf = new Uint8Array(W * H);
      document.body.classList.toggle('portrait', portrait);
      // turning a phone upright leaves full screen, so the status bar comes back
      if (portrait && document.fullscreenElement && matchMedia('(pointer: coarse)').matches) document.exitFullscreen().catch(() => {});
      this.resize();
    }
    // Bottom line: board name for a few seconds, then the clock, then any service messages
    resetBottom(title) {
      this.phase = title ? 'title' : 'clock';
      this.title = title || '';
      this.phaseStart = performance.now();
      this.msgIndex = 0;
      this.queue = [];
    }
    resize() {
      const cssW = this.canvas.parentElement.clientWidth;
      const dpr = window.devicePixelRatio || 1;
      const pitch = Math.max(1, (cssW * dpr) / W);
      this.pitch = pitch;
      this.canvas.width = Math.round(W * pitch);
      this.canvas.height = Math.round(H * pitch);

      // unlit grid, drawn once
      const grid = document.createElement('canvas');
      grid.width = this.canvas.width; grid.height = this.canvas.height;
      const g = grid.getContext('2d');
      const t = THEMES[theme];
      g.fillStyle = '#000'; g.fillRect(0, 0, grid.width, grid.height);
      g.fillStyle = t.unlit;
      const r = pitch * 0.36;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        g.beginPath(); g.arc((x + .5) * pitch, (y + .5) * pitch, r, 0, Math.PI * 2); g.fill();
      }
      this.grid = grid;

      this.sprite = dotSprite(t, pitch);
      this.spriteSize = this.sprite.width;
      // the same dot, faint: for trains you can no longer catch
      this.dimSprite = document.createElement('canvas');
      this.dimSprite.width = this.dimSprite.height = this.spriteSize;
      const dc = this.dimSprite.getContext('2d');
      dc.globalAlpha = 0.3;
      dc.drawImage(this.sprite, 0, 0);
    }
    // Portrait: the whole screen is one tall display. Station and direction at the top,
    // five trains on two lines each, then the clock and messages.
    composePortrait(now) {
      const buf = this.buf; buf.fill(0);
      const trains = visibleTrains(PORTRAIT_TRAINS);
      const dashes = y => { for (let x = 0; x < W; x++) if (x % 6 !== 5) buf[y * W + x] = 1; };
      // centred if it fits, otherwise scrolls round and round inside x0..x1
      const marquee = (text, y, x0 = 2, x1 = W - 2, centre = true) => {
        if (measure(text) > x1 - x0) text = shortDest(text);
        const tw = measure(text);
        if (tw <= x1 - x0 || reduceMotion) {
          const s = fitDest(text, x1 - x0);
          return drawText(buf, s, centre ? Math.round((x0 + x1 - measure(s)) / 2) : x0, y, x0, x1);
        }
        const period = tw + 16, off = Math.floor(now * 0.024) % period;
        drawText(buf, text, x0 - off, y, x0, x1);
        drawText(buf, text, x0 - off + period, y, x0, x1);
      };

      if (current) {
        marquee(current.station, 2);
        marquee(current.bound || current.dirLabel.replace(/ · /g, ' '), 11);
      } else marquee('Departures', 2);
      dashes(22);

      const top = 26;
      if (!current) { marquee('Choose a', top); marquee('station', top + 9); }
      else if (data.mode === 'connecting') marquee('Please wait', top);
      else if (!trains.length) {
        if (data.mode === 'offline') { marquee('Live data', top); marquee('unavailable', top + 9); }
        else { marquee('No trains in', top); marquee('the next hour', top + 9); }
      }
      trains.forEach((t, i) => {
        const y = top + i * 19, label = minsLabel(t.eta), lw = measure(label);
        // "Hainault via Newbury Park": the via part goes on the second line, beside the time
        const m = /^(.*?)\s+((?:via\s.*)|\(.*\))$/.exec(t.dest);
        drawText(buf, String(i + 1), 2, y);
        marquee(m ? m[1] : t.dest, y, 10, W - 1, false);
        if (m) marquee(m[2], y + 9, 10, W - 2 - lw - 4, false);
        drawText(buf, label, W - 2 - lw, y + 9);
        if (walkFor(current) && missed(t)) this.dimRows(y, y + 18);
      });

      const base = top + PORTRAIT_TRAINS * 19;
      dashes(base + 1);
      const y1 = base + 4, y2 = base + 15;
      if (current && APPROACH_MODES.has(current.mode) && trains.length && minsLabel(trains[0].eta) === 'Due') {
        this.approaching = true;
        if (reduceMotion || Math.floor(now / 500) % 2 === 0) marquee('STAND BACK', y1);
        marquee('TRAIN APPROACHING', y2);
        return;
      }
      if (this.approaching) { this.approaching = false; this.phase = 'clock'; this.phaseStart = now; }
      marquee(clockFmt.format(new Date()), y1);
      // message line: the date, then any service messages scrolling through once each
      const msgs = data.messages, elapsed = now - this.phaseStart;
      if (this.phase !== 'msg') {
        marquee(leaveText() || dateFmt.format(new Date()), y2);
        if (msgs.length && elapsed > 9000) { this.phase = 'msg'; this.phaseStart = now; this.queue = msgs.slice(); this.msgIndex = 0; }
      } else {
        const text = this.queue[this.msgIndex] || '';
        if (reduceMotion) {
          drawText(buf, fitDest(text, W - 4), 2, y2);
          if (elapsed > 6000) this.nextMessage(now);
        } else {
          const x = Math.round(W - elapsed * 0.036);
          drawText(buf, text, x, y2);
          if (x + measure(text) < 0) this.nextMessage(now);
        }
      }
    }
    compose(now) {
      if (this.portrait) return this.composePortrait(now);
      const buf = this.buf; buf.fill(0);
      const trains = visibleTrains(3);

      if (!current) {
        drawText(buf, 'Choose a station', 2, ROW_Y[0]);
      } else if (data.mode === 'connecting') {
        drawText(buf, 'Please wait', 2, ROW_Y[0]);
      } else if (!trains.length) {
        drawText(buf, data.mode === 'offline' ? 'Live data unavailable' : 'No trains in the next hour', 2, ROW_Y[0]);
      }
      trains.forEach((t, i) => {
        const y = ROW_Y[i];
        const label = minsLabel(t.eta);
        const lw = measure(label);
        drawText(buf, String(i + 1), 2, y);
        drawText(buf, fitDest(t.dest, W - 12 - lw - 8), 12, y);
        drawText(buf, label, W - 2 - lw, y);
        if (walkFor(current) && missed(t)) this.dimRows(y, y + 9);
      });

      const y = ROW_Y[3];
      // As on the Tube and DLR: flash a warning while the first train is due
      if (current && APPROACH_MODES.has(current.mode) && trains.length && minsLabel(trains[0].eta) === 'Due') {
        this.approaching = true;
        if (reduceMotion || Math.floor(now / 500) % 2 === 0) drawText(buf, APPROACH_TEXT, Math.round((W - measure(APPROACH_TEXT)) / 2), y);
        return;
      }
      if (this.approaching) { this.approaching = false; this.phase = 'clock'; this.phaseStart = now; }
      const msgs = data.messages;
      const elapsed = now - this.phaseStart;
      if (this.phase === 'title') {
        // centred if it fits, otherwise scrolled through once like a service message
        const tw = measure(this.title);
        if (tw <= W - 4 || reduceMotion) {
          const text = fitDest(this.title, W - 4);
          drawText(buf, text, Math.round((W - measure(text)) / 2), y);
          if (elapsed > 5000) { this.phase = 'clock'; this.phaseStart = now; }
        } else {
          const x = Math.round(W - elapsed * 0.036);
          drawText(buf, this.title, x, y);
          if (x + tw < 0) { this.phase = 'clock'; this.phaseStart = now; }
        }
      } else if (this.phase === 'clock') {
        const leave = leaveText();
        const clock = clockFmt.format(new Date()) + (leave ? '   ' + leave : '');
        drawText(buf, clock, Math.round((W - measure(clock)) / 2), y);
        if (msgs.length && elapsed > 9000) { this.phase = 'msg'; this.phaseStart = now; this.queue = msgs.slice(); this.msgIndex = 0; }
      } else {
        const text = this.queue[this.msgIndex] || '';
        const tw = measure(text);
        if (reduceMotion) {
          drawText(buf, fitDest(text, W - 4), 2, y);
          if (elapsed > 6000) this.nextMessage(now);
        } else {
          const x = Math.round(W - elapsed * 0.036);
          drawText(buf, text, x, y);
          if (x + tw < 0) this.nextMessage(now);
        }
      }
    }
    nextMessage(now) {
      this.msgIndex++;
      this.phaseStart = now;
      if (this.msgIndex >= this.queue.length) { this.phase = 'clock'; this.msgIndex = 0; }
    }
    paint() {
      const { ctx, pitch, sprite, spriteSize, buf } = this;
      ctx.drawImage(this.grid, 0, 0);
      const off = spriteSize / 2;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const v = buf[y * W + x];
        if (v) ctx.drawImage(v === 2 ? this.dimSprite : sprite, (x + .5) * pitch - off, (y + .5) * pitch - off);
      }
    }
    dimRows(y0, y1) {
      for (let y = Math.max(0, y0); y < Math.min(H, y1); y++) for (let x = 0; x < W; x++) if (this.buf[y * W + x] === 1) this.buf[y * W + x] = 2;
    }
  }

  const canvas = document.getElementById('board');
  const board = new Board(canvas);

  function describe() {
    let full = 'Choose a station to show departures.';
    if (current) {
      const t = visibleTrains(3);
      const text = t.length ? t.map(x => `${x.dest} ${minsLabel(x.eta)}${walkFor(current) && missed(x) ? ' (too soon to catch)' : ''}`).join(', ') : 'no trains in the next hour';
      const leave = leaveText();
      full = `${titleOf(current)}: ${text}.` + (leave ? ` ${leave}.` : '') + (data.messages.length ? ' ' + data.messages.join('. ') + '.' : '');
    }
    canvas.setAttribute('aria-label', full);
    const sr = document.getElementById('sr');
    if (sr.textContent !== full) sr.textContent = full;
  }

  let lastSecond = 0;
  function frame(now) {
    board.compose(now); board.paint();
    if (now - lastSecond > 15000) { describe(); lastSecond = now; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setInterval(refresh, 30000);

  // ---------- choosing a board ----------
  let favs = store.get('favourites', []);
  const isFav = b => b && favs.some(f => keyOf(f) === keyOf(b));

  function show(b) {
    current = b;
    const t = THEMES[boardThemes[keyOf(b)]] ? boardThemes[keyOf(b)] : 'amber';
    if (t !== theme) { theme = t; applyTheme(); board.resize(); }
    data = { trains: [], messages: [], mode: 'connecting', updated: 0 };
    board.resetBottom(`${b.station} ${b.bound || b.dirLabel.replace(/ · /g, ' ')}${b.via ? ' calling at ' + b.via.name : ''}`);
    store.set('last', b);
    history.replaceState(null, '', '#' + keyOf(b));
    document.title = `${b.station} ${b.bound || ''} departures`.replace(/\s+/g, ' ');
    renderChrome();
    updateStatus();
    describe();
    refresh();
    if (settings.open) renderBoardSettings();
  }

  function toggleFav(b) {
    if (isFav(b)) favs = favs.filter(f => keyOf(f) !== keyOf(b));
    else favs = favs.concat([{ ...b }]);
    store.set('favourites', favs);
    renderChrome();
  }

  const caption = document.getElementById('caption');
  const favBar = document.getElementById('favs');
  const star = document.getElementById('star');
  function renderChrome() {
    caption.textContent = current ? titleOf(current) : '';
    star.hidden = !current;
    document.getElementById('gear').hidden = !current;
    const on = isFav(current);
    star.setAttribute('aria-pressed', String(on));
    star.textContent = on ? '★ Favourite' : '☆ Favourite';
    star.title = on ? 'Remove from favourites' : 'Add to favourites';
    favBar.replaceChildren(...favs.map((f, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.title = titleOf(f);
      btn.setAttribute('aria-current', String(!!current && keyOf(f) === keyOf(current)));
      if (i < 9) { const k = document.createElement('kbd'); k.textContent = i + 1; btn.append(k); }
      btn.append(favName(f));
      btn.addEventListener('click', () => show(f));
      return btn;
    }));
    favFade();
    favBar.querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  const favFade = () => {
    favBar.classList.toggle('more', favBar.scrollLeft + favBar.clientWidth < favBar.scrollWidth - 1);
    favBar.classList.toggle('less', favBar.scrollLeft > 1);
  };
  favBar.addEventListener('scroll', favFade, { passive: true });
  addEventListener('resize', favFade);
  star.addEventListener('click', () => current && toggleFav(current));

  // picker dialog
  const picker = document.getElementById('picker');
  const q = document.getElementById('q');
  const results = document.getElementById('results');
  const backBtn = document.getElementById('back');
  const searchWrap = document.getElementById('search-wrap');
  const pickerTitle = document.getElementById('picker-title');
  let searchCtl, openToken;

  const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

  const swatchFor = b => {
    const colours = linesOf(b).map(l => lineColour(l, b.mode));
    return colours.length > 1
      ? `linear-gradient(${colours.map((c, i) => `${c} ${i / colours.length * 100}% ${(i + 1) / colours.length * 100}%`).join(', ')})`
      : colours[0];
  };

  // A favourite (removable) opens straight away; a station's direction goes on to "Which trains?"
  function boardRow(b, sub, { removable } = {}) {
    const main = el('button', { type: 'button', className: 'main' },
      el('span', { className: 'swatch' }),
      el('span', { className: 'text' }, el('span', { textContent: removable ? favName(b) : b.dirLabel }), sub ? el('span', { className: 'sub', textContent: sub }) : ''));
    main.firstChild.style.background = swatchFor(b);
    main.addEventListener('click', () => {
      if (removable) { show(b); picker.close(); } else showTrainsStep(b, sub);
    });
    const fav = el('button', { type: 'button', className: 'icon' });
    const paint = () => {
      const on = isFav(b);
      fav.textContent = removable ? '✕' : on ? '★' : '☆';
      fav.setAttribute('aria-label', (removable || on ? 'Remove from favourites: ' : 'Add to favourites: ') + titleOf(b));
      if (!removable) fav.setAttribute('aria-pressed', String(on));
    };
    paint();
    fav.addEventListener('click', () => { toggleFav(b); if (removable) showHome(); else paint(); });
    return el('li', { className: 'row' }, main, fav);
  }

  function saveFavs() {
    store.set('favourites', favs);
    renderChrome();
  }

  function favEditRow(f, i) {
    const up = el('button', { type: 'button', textContent: '▲', disabled: i === 0, className: 'up' });
    const down = el('button', { type: 'button', textContent: '▼', disabled: i === favs.length - 1, className: 'down' });
    up.setAttribute('aria-label', `Move ${favName(f)} up`);
    down.setAttribute('aria-label', `Move ${favName(f)} down`);
    const move = d => {
      [favs[i], favs[i + d]] = [favs[i + d], favs[i]];
      saveFavs();
      showHome();
      const row = results.querySelectorAll('.fav-edit')[i + d];
      const btn = row.querySelector(d < 0 ? '.up' : '.down');
      (btn.disabled ? row.querySelector(d < 0 ? '.down' : '.up') : btn).focus();
    };
    up.addEventListener('click', () => move(-1));
    down.addEventListener('click', () => move(1));
    const name = el('input', { type: 'text', value: f.name || '', placeholder: f.short, autocomplete: 'off' });
    name.setAttribute('aria-label', `Name for ${titleOf(f)}`);
    name.addEventListener('input', () => {
      const v = name.value.trim();
      if (v) f.name = v; else delete f.name;
      saveFavs();
    });
    name.addEventListener('keydown', e => { if (e.key === 'Enter') name.blur(); });
    const swatch = el('span', { className: 'swatch' });
    swatch.style.background = swatchFor(f);
    const remove = el('button', { type: 'button', className: 'icon', textContent: '✕' });
    remove.setAttribute('aria-label', `Remove from favourites: ${favName(f)}`);
    remove.addEventListener('click', () => { favs.splice(i, 1); saveFavs(); showHome(); });
    return el('li', { className: 'fav-edit' }, el('span', { className: 'arrows' }, up, down), swatch, name, remove);
  }

  // ---------- moving favourites to another device ----------
  // The link carries the favourites (and their colours) in its #import= part; nothing is sent anywhere.
  const toB64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)));
  const str = v => typeof v === 'string' ? v : '';
  function cleanFav(f) {
    if (!f || typeof f !== 'object' || !str(f.naptan) || !str(f.station) || !(str(f.line) || Array.isArray(f.lines))) return null;
    const b = {};
    for (const k of ['naptan', 'station', 'stopName', 'line', 'lineName', 'mode', 'bound', 'dir', 'platform', 'dirLabel', 'short', 'name']) if (str(f[k])) b[k] = f[k];
    if (Array.isArray(f.lines)) b.lines = f.lines.filter(x => typeof x === 'string');
    if (f.via && str(f.via.naptan) && str(f.via.name)) b.via = { naptan: f.via.naptan, name: f.via.name };
    b.line ||= b.lines?.[0];
    b.dirLabel ||= b.bound || b.dir || '';
    b.short ||= b.station;
    if (!b.line) return null;
    return { b, theme: THEMES[f.theme] ? f.theme : '' };
  }
  const shareLink = () => `${location.origin}${location.pathname}#import=${toB64(JSON.stringify(favs.map(f => ({ ...f, theme: boardThemes[keyOf(f)] }))))}`;
  function readImport(text) {
    const m = /#import=([\w-]+)/.exec(text || '');
    if (!m) return null;
    try { return JSON.parse(fromB64(m[1])).map(cleanFav).filter(Boolean); } catch (e) { return null; }
  }

  async function shareFavs(button) {
    const url = shareLink();
    const say = text => { const n = results.querySelector('.share-note'); if (n) n.textContent = text; };
    try {
      if (navigator.share && matchMedia('(pointer: coarse)').matches) { await navigator.share({ title: 'My departure boards', url }); return; }
      await navigator.clipboard.writeText(url);
      say('Link copied. Open it on the other device, or paste it into the search box of the installed app.');
    } catch (e) {
      if (e.name === 'AbortError') return;
      const box = el('input', { type: 'text', value: url, readOnly: true });
      box.setAttribute('aria-label', 'Favourites link');
      results.querySelector('.share-note')?.replaceWith(el('p', { className: 'note share-note' }, 'Copy this link, then open it on the other device or paste it into the installed app’s search box:', box));
      box.select();
    }
  }

  function offerImport(list) {
    if (!picker.open) picker.showModal();
    view = 'import'; openToken = null;
    backBtn.hidden = false; searchWrap.hidden = true;
    pickerTitle.textContent = 'Add favourites';
    const fresh = list.filter(x => !isFav(x.b));
    const add = el('button', { type: 'button', className: 'primary', textContent: fresh.length ? `Add ${fresh.length} favourite${fresh.length > 1 ? 's' : ''}` : 'Done' });
    add.addEventListener('click', () => {
      for (const { b, theme: th } of fresh) {
        favs.push(b);
        if (th && th !== 'amber') boardThemes[keyOf(b)] = th;
      }
      store.set('boardThemes', boardThemes);
      saveFavs();
      q.value = '';
      showHome();
    });
    results.replaceChildren(
      el('p', { className: 'note', textContent: !fresh.length
        ? 'All of these boards are already in your favourites.'
        : fresh.length === list.length
          ? 'This link has these boards. Add them to your favourites on this device?'
          : `${list.length - fresh.length} of these boards are already in your favourites; the other ${fresh.length} will be added.` }),
      el('ul', {}, ...list.map(({ b }) => {
        const row = el('li', { className: 'row' }, el('span', { className: 'main' }, el('span', { className: 'swatch' }),
          el('span', { className: 'text' }, el('span', { textContent: favName(b) }), el('span', { className: 'sub', textContent: titleOf(b) + (isFav(b) ? ' · already added' : '') }))));
        row.querySelector('.swatch').style.background = swatchFor(b);
        return row;
      })),
      el('div', { className: 'actions' }, add));
    add.focus();
  }

  let editing = false, view = 'home', stationView = null;
  function showHome() {
    backBtn.hidden = true; searchWrap.hidden = false; openToken = null; view = 'home';
    pickerTitle.textContent = 'Choose a board';
    if (q.value.trim().length >= 2) return search();
    const parts = [];
    if (!favs.length) editing = false;
    if (favs.length) {
      const edit = el('button', { type: 'button', textContent: editing ? 'Done' : 'Edit' });
      edit.setAttribute('aria-pressed', String(editing));
      edit.setAttribute('aria-label', editing ? 'Done editing favourites' : 'Rename or reorder favourites');
      edit.addEventListener('click', () => {
        editing = !editing;
        showHome();
        (editing ? results.querySelector('.fav-edit input') : results.querySelector('h3 button'))?.focus();
      });
      const share = el('button', { type: 'button', textContent: 'Share', hidden: editing });
      share.setAttribute('aria-label', 'Copy a link to move these favourites to another device');
      share.addEventListener('click', () => shareFavs(share));
      parts.push(el('h3', {}, el('span', { textContent: 'Favourites' }), share, edit),
        el('ul', {}, ...favs.map((f, i) => editing ? favEditRow(f, i) : boardRow(f, titleOf(f), { removable: true }))));
    }
    parts.push(el('p', { className: 'note', textContent: editing
      ? 'Type over a name to rename it, or clear it to go back to the automatic one.'
      : favs.length
        ? 'Search for a station, or tap Near me, to add another board.'
        : 'Search for a station or tap Near me, pick a direction, then tap ☆ to keep it here for next time.' }));
    if (favs.length && !editing) parts.push(el('p', { className: 'note share-note' }));
    results.replaceChildren(...parts);
  }

  function stationRow(m, sub) {
    const main = el('button', { type: 'button', className: 'main' },
      el('span', { className: 'text' }, el('span', { textContent: cleanName(m.name) }), el('span', { className: 'sub', textContent: sub })));
    main.addEventListener('click', () => openStation(m));
    return el('li', { className: 'row' }, main);
  }

  // ---------- stations near me ----------
  const metres = d => d < 1000 ? `${Math.max(50, Math.round(d / 50) * 50)} m` : `${(d / 1000).toFixed(1)} km`;
  const modeList = modes => modes.filter(x => MODES.includes(x)).map(x => x.replace('-', ' ')).join(', ');
  async function nearMe() {
    clearTimeout(searchTimer);
    searchCtl?.abort();
    q.value = '';
    view = 'near';
    const token = openToken = {};
    const say = text => results.replaceChildren(el('p', { className: 'note', textContent: text }));
    if (!navigator.geolocation) return say('This browser can’t share your location.');
    say('Finding your location…');
    let pos;
    try {
      pos = await new Promise((resolve, reject) =>
        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 15000, maximumAge: 60000 }));
    } catch (e) {
      if (token === openToken) say(e.code === 1
        ? 'Location access is turned off for this site. You can allow it in your browser’s settings.'
        : 'Couldn’t find your location. Try again, or search instead.');
      return;
    }
    if (token !== openToken) return;
    say('Finding stations nearby…');
    try {
      const { latitude: lat, longitude: lon } = pos.coords;
      const res = await getJSON(`/StopPoint/?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}&stopTypes=NaptanMetroStation,NaptanRailStation&radius=2000&modes=${MODES.join(',')}&returnLines=false`);
      if (token !== openToken) return;
      // one entry per station, even where it has separate stops for different lines
      const byStation = new Map();
      for (const s of res.stopPoints || []) {
        const id = s.hubNaptanCode || s.naptanId;
        const seen = byStation.get(id);
        if (seen) { seen.distance = Math.min(seen.distance, s.distance); seen.modes = [...new Set(seen.modes.concat(s.modes))]; }
        else byStation.set(id, { id, name: s.commonName, distance: s.distance, modes: s.modes });
      }
      const near = [...byStation.values()].filter(s => modeList(s.modes)).sort((a, b) => a.distance - b.distance).slice(0, 8);
      if (!near.length) return say('No Tube, Elizabeth line, Overground, DLR or tram stations within 2 km.');
      results.replaceChildren(el('h3', {}, el('span', { textContent: 'Stations near you' })),
        el('ul', {}, ...near.map(s => stationRow(s, `${metres(s.distance)} · ${modeList(s.modes)}`))));
      results.querySelector('.main')?.focus();
    } catch (e) {
      if (token === openToken) say('Couldn’t reach TfL. Check your connection and try again.');
    }
  }
  document.getElementById('near').addEventListener('click', nearMe);

  // ---------- which trains? ----------
  const lineStopsCache = {};
  async function stopsAlong(b) {
    const lists = await Promise.all(linesOf(b).map(line =>
      lineStopsCache[line] ||= getJSON(`/Line/${line}/StopPoints`).catch(() => { delete lineStopsCache[line]; return []; })));
    const byId = new Map();
    for (const s of lists.flat()) {
      const name = cleanName(s.commonName);
      if (s.naptanId === b.naptan || name === b.station) continue;
      byId.set(s.naptanId, { naptan: s.naptanId, name });
    }
    return [...byId.values()];
  }

  function showTrainsStep(b, sub) {
    view = 'trains';
    backBtn.hidden = false; searchWrap.hidden = true;
    pickerTitle.textContent = `${b.station} · ${b.dirLabel}`;
    let via = null, checkToken;
    const all = el('input', { type: 'radio', name: 'which', checked: true });
    const only = el('input', { type: 'radio', name: 'which' });
    const viaQ = el('input', { type: 'search', placeholder: 'Station name', autocomplete: 'off' });
    viaQ.setAttribute('aria-label', 'Only trains calling at this station');
    const sugg = el('ul');
    const note = el('span', { className: 'sub' });
    const go = el('button', { type: 'button', className: 'primary', textContent: 'Show board' });

    const pick = async s => {
      via = s;
      viaQ.value = s.name;
      sugg.replaceChildren();
      note.textContent = 'Checking which trains call there…';
      const token = checkToken = {};
      try {
        const d = await loadBoard({ ...b, via });
        if (token !== checkToken) return;
        const soon = d.trains.filter(tr => tr.eta < Date.now() + 60 * 60e3);
        const dests = [...new Set(soon.map(tr => shortDest(tr.dest)))];
        note.textContent = soon.length
          ? `Right now: ${soon.length} train${soon.length > 1 ? 's' : ''} in the next hour, to ${dests.join(', ')}`
          : 'No trains from here call there in the next hour. It may be the other direction, or not on this route.';
      } catch (e) {
        if (token === checkToken) note.textContent = 'Couldn’t check with TfL just now, but you can still show the board.';
      }
    };
    viaQ.addEventListener('focus', () => { only.checked = true; });
    viaQ.addEventListener('input', async () => {
      only.checked = true;
      via = null;
      note.textContent = '';
      const term = viaQ.value.trim().toLowerCase();
      if (!term) return sugg.replaceChildren();
      const stops = await stopsAlong(b);
      if (viaQ.value.trim().toLowerCase() !== term) return;
      const hits = stops.filter(s => s.name.toLowerCase().includes(term))
        .sort((x, y) => (y.name.toLowerCase().startsWith(term) - x.name.toLowerCase().startsWith(term)) || x.name.localeCompare(y.name))
        .slice(0, 6);
      sugg.replaceChildren(...hits.map(s => {
        const btn = el('button', { type: 'button', textContent: s.name });
        btn.addEventListener('click', () => pick(s));
        return el('li', {}, btn);
      }));
      if (!hits.length) note.textContent = 'No station on this line matches.';
    });
    go.addEventListener('click', () => {
      if (only.checked && !via) { note.textContent = 'Choose a station from the list first.'; viaQ.focus(); return; }
      show(only.checked ? { ...b, via, short: `${b.short} via ${via.name}` } : b);
      picker.close();
    });

    results.replaceChildren(
      el('h3', {}, el('span', { textContent: 'Which trains?' })),
      el('label', { className: 'opt' }, all, el('span', { className: 'text' }, el('span', { textContent: 'All trains' }), sub ? el('span', { className: 'sub', textContent: sub }) : '')),
      el('label', { className: 'opt' }, only, el('span', { className: 'text' }, el('span', { textContent: 'Only trains calling at…' }),
        el('span', { className: 'via' }, viaQ, sugg, note))),
      el('div', { className: 'actions' }, go));
    go.focus();
  }

  async function search() {
    const term = q.value.trim();
    if (term.length < 2) return showHome();
    searchCtl?.abort();
    searchCtl = new AbortController();
    try {
      const res = await getJSON(`/StopPoint/Search/${encodeURIComponent(term)}?modes=${MODES.join(',')}&maxResults=12`, searchCtl.signal);
      if (searchWrap.hidden || view === 'near') return;
      const matches = (res.matches || []).filter(m => m.modes.some(x => MODES.includes(x)));
      if (!matches.length) return results.replaceChildren(el('p', { className: 'note', textContent: `No stations match “${term}”.` }));
      results.replaceChildren(el('ul', {}, ...matches.map(m => stationRow(m, modeList(m.modes)))));
    } catch (e) {
      if (e.name !== 'AbortError') results.replaceChildren(el('p', { className: 'note', textContent: 'Couldn’t reach TfL. Check your connection and try again.' }));
    }
  }
  let searchTimer;
  q.addEventListener('input', () => {
    const list = readImport(q.value);
    if (list && list.length) { clearTimeout(searchTimer); return offerImport(list); }
    view = 'home'; openToken = null; clearTimeout(searchTimer); searchTimer = setTimeout(search, 250); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(searchTimer); search(); } });

  // Work out which line + direction boards a station offers, from the trains it has right now
  async function openStation(m) {
    clearTimeout(searchTimer);
    searchCtl?.abort();
    const station = cleanName(m.name);
    view = 'station'; stationView = null;
    backBtn.hidden = false; searchWrap.hidden = true;
    pickerTitle.textContent = station;
    results.replaceChildren(el('p', { className: 'note', textContent: 'Finding lines and directions…' }));
    backBtn.focus();
    try {
      const token = openToken = {};
      const detail = await getJSON(`/StopPoint/${m.id}`);
      const stops = (m.id.startsWith('HUB') ? detail.children || [] : [detail])
        .filter(s => (s.modes || []).some(x => MODES.includes(x)));
      const lineInfo = [];   // { naptan, stopName, line, lineName, mode }
      const addLines = (s, only) => {
        const names = Object.fromEntries((s.lines || []).map(l => [l.id, l.name]));
        for (const g of s.lineModeGroups || []) {
          if (!MODES.includes(g.modeName)) continue;
          for (const line of g.lineIdentifier) {
            if (only && !only.includes(line)) continue;
            lineInfo.push({ naptan: s.id || s.naptanId, stopName: cleanName(s.commonName), line, lineName: /line$/i.test(names[line] || '') || g.modeName !== 'tube' ? (names[line] || line) : names[line] + ' line', mode: g.modeName });
          }
        }
      };
      stops.forEach(s => addLines(s));
      // Some lines at a hub use a stop TfL doesn't list among its children; find it from the line itself
      const missing = (detail.lineModeGroups || []).filter(g => MODES.includes(g.modeName))
        .flatMap(g => g.lineIdentifier).filter(line => !lineInfo.some(x => x.line === line));
      if (m.id.startsWith('HUB') && missing.length) {
        const lineStops = await Promise.all(missing.map(line => getJSON(`/Line/${line}/StopPoints`).catch(() => [])));
        missing.forEach((line, i) => {
          const s = lineStops[i].find(x => x.hubNaptanCode === m.id);
          if (!s) return;
          if (!stops.some(x => x.id === s.naptanId)) stops.push({ ...s, id: s.naptanId });
          addLines(s, [line]);
        });
      }
      const [arrivals, departures] = await Promise.all([
        Promise.all(stops.map(s => getJSON(`/StopPoint/${s.id}/Arrivals`).catch(() => []))),
        Promise.all(lineInfo.map(x => TIMETABLED.has(x.mode)
          ? getJSON(`/StopPoint/${x.naptan}/ArrivalDepartures?lineIds=${x.line}`).catch(() => null) : null))
      ]);
      if (token !== openToken || view !== 'station') return;
      const options = new Map();
      const platforms = new Map();   // naptan|platform -> { naptan, stopName, platform, lines, dests }
      lineInfo.forEach((info, i) => {
        const names = [station, info.stopName];
        const services = servicesAt(info.naptan, names, info.line, arrivals[stops.findIndex(s => s.id === info.naptan)], departures[i]);
        const base = { naptan: info.naptan, station, stopName: info.stopName, line: info.line, lineName: info.lineName, mode: info.mode };
        for (const sv of services) {
          if (sv.cancelled) continue;
          if (platformOf(sv.platform)) {
            const pk = info.naptan + '|' + sv.platform;
            if (!platforms.has(pk)) platforms.set(pk, { naptan: info.naptan, stopName: info.stopName, mode: info.mode, platform: sv.platform, lines: new Map(), dests: new Map() });
            const pl = platforms.get(pk);
            pl.lines.set(info.line, info.lineName.replace(/ line$/i, ''));
            if (!/check front/i.test(sv.dest)) pl.dests.set(shortDest(sv.dest), (pl.dests.get(shortDest(sv.dest)) || 0) + 1);
          }
          const [kind, value] = [sv.key.slice(0, 1), sv.key.slice(2)];
          const b = { ...base, bound: kind === 'b' ? value : '', dir: kind === 'd' ? value : '' };
          const k = keyOf(b);
          if (!options.has(k)) options.set(k, { b, dests: new Map() });
          const dest = shortDest(sv.dest);
          const o = options.get(k);
          if (dest && !/check front/i.test(dest)) o.dests.set(dest, (o.dests.get(dest) || 0) + 1);
        }
      });
      // Lines with nothing running right now still get plain choices, unless the only
      // trains TfL lists are ones finishing here (it publishes no departures for some termini)
      const seenLines = new Set([...options.values()].map(o => o.b.line));
      const groups = {};
      for (const info of lineInfo) {
        if (seenLines.has(info.line)) continue;
        seenLines.add(info.line);
        const names = [station, info.stopName];
        const terminating = lineInfo.filter(x => x.line === info.line).some(x =>
          arrivals[stops.findIndex(s => s.id === x.naptan)].some(t => t.lineId === x.line &&
            (t.destinationNaptanId === x.naptan || names.includes(cleanName(t.destinationName)))));
        if (terminating) {
          groups[info.lineName] = [el('li', {}, el('p', { className: 'note', textContent: 'Trains on this line finish here, and TfL doesn’t publish their departures from this station.' }))];
          continue;
        }
        for (const dir of TIMETABLED.has(info.mode) ? ['all'] : ['outbound', 'inbound']) {
          const b = { naptan: info.naptan, station, stopName: info.stopName, line: info.line, lineName: info.lineName, mode: info.mode, bound: '', dir };
          options.set(keyOf(b), { b, dests: new Map(), quiet: true });
        }
      }
      if (!options.size && !Object.keys(groups).length) return results.replaceChildren(el('p', { className: 'note', textContent: 'No live departures are available for this station.' }));

      const stopsPerLine = {};
      for (const o of options.values()) (stopsPerLine[o.b.line] ||= new Set()).add(o.b.naptan);
      for (const o of options.values()) {
        const top = [...o.dests.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]).slice(0, 3);
        const b = o.b;
        b.dirLabel = b.bound || (top.length ? 'Towards ' + top.slice(0, 2).join(', ') : dirName(b.dir));
        b.short = `${station} ${b.bound || (top.length ? '→ ' + top[0] : dirName(b.dir).toLowerCase())}`;
        const subs = [];
        if (top.length > (b.bound ? 0 : 2)) subs.push('towards ' + top.join(', '));
        if (stopsPerLine[b.line].size > 1) subs.push(b.stopName);
        if (o.quiet) subs.push('no trains right now');
        (groups[b.lineName] ||= []).push(boardRow(b, subs.join(' · ')));
      }
      // Platforms that more than one line uses get a combined board
      const shared = [...platforms.values()].filter(pl => pl.lines.size > 1)
        .sort((a, b) => a.platform.localeCompare(b.platform, 'en', { numeric: true }));
      const sharedRows = shared.map(pl => {
        const lines = [...pl.lines.keys()].sort();
        const label = platformLabel(pl.platform);
        const b = { naptan: pl.naptan, station, stopName: pl.stopName, line: lines[0], lines,
                    lineName: lines.map(l => pl.lines.get(l)).join(', '), mode: pl.mode,
                    platform: pl.platform, bound: '', dir: '', dirLabel: label,
                    short: `${station} ${boundOf(pl.platform) ? boundOf(pl.platform) + ' ' : ''}P${platformOf(pl.platform)}` };
        const top = [...pl.dests.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]).slice(0, 3);
        return boardRow(b, [b.lineName, top.length && 'towards ' + top.join(', ')].filter(Boolean).join(' · '));
      });
      results.replaceChildren(
        ...(sharedRows.length ? [el('h3', { textContent: 'Shared platforms' }), el('ul', {}, ...sharedRows)] : []),
        ...Object.entries(groups).flatMap(([name, rows]) => [el('h3', { textContent: name }), el('ul', {}, ...rows)]));
      stationView = { title: station, nodes: [...results.childNodes] };
      results.querySelector('.main')?.focus();
    } catch (e) {
      results.replaceChildren(el('p', { className: 'note', textContent: 'Couldn’t reach TfL. Check your connection and try again.' }));
    }
  }

  function openPicker() {
    if (!picker.open) picker.showModal();
    q.value = '';
    editing = false;
    showHome();
    q.focus();
  }
  backBtn.addEventListener('click', () => {
    if (view === 'import') q.value = '';
    if (view === 'trains' && stationView) {
      view = 'station';
      searchWrap.hidden = true;
      pickerTitle.textContent = stationView.title;
      results.replaceChildren(...stationView.nodes);
      results.querySelector('.main')?.focus();
    } else { showHome(); q.focus(); }
  });
  document.getElementById('close').addEventListener('click', () => picker.close());
  document.getElementById('change').addEventListener('click', openPicker);
  picker.addEventListener('click', e => { if (e.target === picker) picker.close(); });   // backdrop

  // ---------- settings ----------
  const settings = document.getElementById('settings');
  const themeBox = document.getElementById('themes');
  function drawPreview(canvas, t) {
    const buf = new Uint8Array(LW * LH);
    const put = (s, x, y) => drawText(buf, s, x, y, 0, LW, LW, LH);
    [['1', 'Epping', '2 min'], ['2', 'Loughton', '6 min']].forEach(([n, dest, mins], i) => {
      put(n, 2, ROW_Y[i]); put(dest, 12, ROW_Y[i]); put(mins, LW - 2 - measure(mins), ROW_Y[i]);
    });
    put('17:28:41', Math.round((LW - measure('17:28:41')) / 2), ROW_Y[3]);
    const pitch = Math.max(1, (canvas.clientWidth * (window.devicePixelRatio || 1)) / LW);
    canvas.width = Math.round(LW * pitch); canvas.height = Math.round(LH * pitch);
    const g = canvas.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, canvas.width, canvas.height);
    const sprite = dotSprite(t, pitch), off = sprite.width / 2;
    g.fillStyle = t.unlit;
    for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
      if (buf[y * LW + x]) g.drawImage(sprite, (x + .5) * pitch - off, (y + .5) * pitch - off);
      else { g.beginPath(); g.arc((x + .5) * pitch, (y + .5) * pitch, pitch * .36, 0, Math.PI * 2); g.fill(); }
    }
  }
  function renderThemes() {
    themeBox.replaceChildren(...Object.entries(THEMES).map(([id, t]) => {
      const c = el('canvas');
      const btn = el('button', { type: 'button', className: 'theme' }, c, el('span', { textContent: t.name }));
      btn.setAttribute('aria-pressed', String(id === theme));
      btn.addEventListener('click', () => {
        theme = id;
        if (id === 'amber') delete boardThemes[keyOf(current)]; else boardThemes[keyOf(current)] = id;
        store.set('boardThemes', boardThemes);
        applyTheme();
        board.resize();
        renderThemes();
        themeBox.querySelector('[aria-pressed="true"]').focus();
      });
      requestAnimationFrame(() => drawPreview(c, t));
      return btn;
    }));
  }
  const walkValue = document.getElementById('walk-value');
  function renderWalk() {
    const w = walkFor(current);
    document.getElementById('walk-title').textContent = `Walking time to ${current.station}`;
    walkValue.textContent = w ? `${w} min` : 'Off';
    document.getElementById('walk-minus').disabled = !w;
  }
  function setWalk(d) {
    const w = Math.max(0, Math.min(45, walkFor(current) + d));
    if (w) walkTimes[current.naptan] = w; else delete walkTimes[current.naptan];
    store.set('walkTimes', walkTimes);
    renderWalk();
    describe();
  }
  document.getElementById('walk-minus').addEventListener('click', () => setWalk(-1));
  document.getElementById('walk-plus').addEventListener('click', () => setWalk(1));

  const rulesBox = document.getElementById('rules');
  const DAYS = { weekdays: 'Weekdays', weekends: 'Weekends', daily: 'Every day' };
  function saveRules() { store.set('schedule', schedule); lastRule = ''; applySchedule(); }
  function renderRules() {
    schedule = schedule.filter(r => favs.some(f => keyOf(f) === r.key));
    document.getElementById('rule-add').disabled = !favs.length;
    document.getElementById('rules-note').textContent = !favs.length
      ? 'Save a favourite first, then you can switch to it automatically at certain times.'
      : schedule.length ? 'At these times the board switches to that favourite, including when you open the app. You can still change board by hand.'
        : 'Switch to a favourite automatically at certain times, e.g. your morning board on weekdays.';
    rulesBox.replaceChildren(...schedule.map((r, i) => {
      const fav = el('select', {}, ...favs.map(f => el('option', { value: keyOf(f), textContent: favName(f), selected: keyOf(f) === r.key })));
      const days = el('select', {}, ...Object.entries(DAYS).map(([v, label]) => el('option', { value: v, textContent: label, selected: v === r.days })));
      const from = el('input', { type: 'time', value: r.from }), to = el('input', { type: 'time', value: r.to });
      fav.setAttribute('aria-label', 'Board'); days.setAttribute('aria-label', 'Days');
      from.setAttribute('aria-label', 'From'); to.setAttribute('aria-label', 'Until');
      const update = () => { Object.assign(r, { key: fav.value, days: days.value, from: from.value || r.from, to: to.value || r.to }); saveRules(); };
      [fav, days, from, to].forEach(x => x.addEventListener('change', update));
      const remove = el('button', { type: 'button', className: 'remove', textContent: '✕' });
      remove.setAttribute('aria-label', `Remove the rule for ${favName(favs.find(f => keyOf(f) === r.key))}`);
      remove.addEventListener('click', () => { schedule.splice(i, 1); saveRules(); renderRules(); });
      return el('li', {}, fav, days, from, el('span', { textContent: 'to' }), to, remove);
    }));
  }
  document.getElementById('rule-add').addEventListener('click', () => {
    const f = favs.find(x => current && keyOf(x) === keyOf(current)) || favs[0];
    schedule.push({ key: keyOf(f), days: 'weekdays', from: '07:00', to: '09:30' });
    saveRules();
    renderRules();
    rulesBox.lastElementChild?.querySelector('select')?.focus();
  });

  // the parts of settings that belong to the board on show
  function renderBoardSettings() {
    const fav = favs.find(f => keyOf(f) === keyOf(current));
    document.getElementById('theme-note').textContent = `${fav ? favName(fav) : titleOf(current)}. Other boards keep their own colours.`;
    renderThemes();
    renderWalk();
  }
  document.getElementById('gear').addEventListener('click', () => {
    if (!current) return;
    renderBoardSettings();
    renderRules();
    settings.showModal();
    themeBox.querySelector('[aria-pressed="true"]')?.focus();
  });
  document.getElementById('settings-close').addEventListener('click', () => settings.close());
  settings.addEventListener('click', e => { if (e.target === settings) settings.close(); });

  // Keyboard: 1-9 jump to a favourite, / or S to change board, F to favourite
  document.addEventListener('keydown', e => {
    if (picker.open || settings.open || e.ctrlKey || e.metaKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
    if (/^[1-9]$/.test(e.key) && favs[e.key - 1]) show(favs[e.key - 1]);
    else if (e.key === '/' || e.key.toLowerCase() === 's') { e.preventDefault(); openPicker(); }
    else if (e.key.toLowerCase() === 'f' && current) toggleFav(current);
  });

  // ---------- start: link > last board > picker ----------
  async function start() {
    const imported = readImport(location.hash);
    if (imported) history.replaceState(null, '', location.pathname + location.search);
    const hash = imported ? '' : decodeURIComponent(location.hash.slice(1));
    const last = store.get('last', null);
    const known = favs.concat(last ? [last] : []);
    let b = hash && known.find(x => keyOf(x) === hash);
    if (!b && /^[^/]+\/[^/]+\/[bdp]:.+$/.test(hash)) {
      // a shared link for a board this browser hasn't seen: rebuild it from TfL
      const [naptan, line, ...rest] = hash.split('/');
      const viaId = rest.length > 1 && rest[rest.length - 1].startsWith('via:') ? rest.pop().slice(4) : '';
      const sel = rest.join('/');
      try {
        const [s, v] = await Promise.all([getJSON(`/StopPoint/${naptan}`), viaId ? getJSON(`/StopPoint/${viaId}`) : null]);
        const lines = line.split('+');
        const station = cleanName(s.commonName);
        const g0 = (s.lineModeGroups || []).find(x => x.lineIdentifier.includes(lines[0]));
        if (sel.startsWith('p:') && g0) {
          const platform = sel.slice(2);
          const names = Object.fromEntries((s.lines || []).map(l => [l.id, l.name]));
          b = { naptan, station, line: lines[0], lines, lineName: lines.map(l => names[l] || l).join(', '), mode: g0.modeName,
                platform, bound: '', dir: '', dirLabel: platformLabel(platform), short: `${station} P${platformOf(platform)}` };
        }
        const l = (s.lines || []).find(x => x.id === line);
        const g = (s.lineModeGroups || []).find(x => x.lineIdentifier.includes(line));
        if (!b && l && g) {
          const bound = sel.startsWith('b:') ? sel.slice(2) : '', dir = sel.startsWith('d:') ? sel.slice(2) : '';
          const station = cleanName(s.commonName);
          const label = bound || dirName(dir);
          b = { naptan, station, line, lineName: g.modeName === 'tube' && !/line$/i.test(l.name) ? l.name + ' line' : l.name, mode: g.modeName, bound, dir, dirLabel: label, short: `${station} ${bound || dir}` };
        }
        if (b && v) b = { ...b, via: { naptan: viaId, name: cleanName(v.commonName) }, short: `${b.short} via ${cleanName(v.commonName)}` };
      } catch (e) {}
    }
    b ||= last;
    renderChrome();
    describe();
    // a link to a particular board wins; otherwise a time-of-day rule that has just started does
    const linked = hash && (!last || keyOf(last) !== hash);
    if (!linked && applySchedule()) b = null;
    if (b) show(b); else if (!current) openPicker();
    if (imported && imported.length) offerImport(imported);
  }
  // ---------- boards by time of day ----------
  // Each rule switches the board once per occurrence, so changing board by hand sticks until the next one
  let schedule = store.get('schedule', []);
  let lastRule = store.get('lastRule', '');
  const londonParts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  function activeRule() {
    const p = Object.fromEntries(londonParts.formatToParts(new Date()).map(x => [x.type, x.value]));
    const hm = `${p.hour}:${p.minute}`, weekend = p.weekday === 'Sat' || p.weekday === 'Sun';
    const rule = schedule.find(r => favs.some(f => keyOf(f) === r.key)
      && (r.days === 'daily' || (r.days === 'weekends') === weekend)
      && (r.from <= r.to ? hm >= r.from && hm < r.to : hm >= r.from || hm < r.to));
    // after midnight, an overnight rule belongs to the occurrence that started the day before
    const date = `${p.year}-${p.month}-${p.day}`;
    return rule && { rule, id: `${rule.key}|${rule.from}|${rule.to}|${rule.from > rule.to && hm < rule.to ? 'prev:' + date : date}` };
  }
  function applySchedule() {
    const a = activeRule();
    if (!a || a.id === lastRule) return false;
    lastRule = a.id;
    store.set('lastRule', lastRule);
    const f = favs.find(x => keyOf(x) === a.rule.key);
    if (f && (!current || keyOf(current) !== keyOf(f))) show(f);
    return true;
  }
  setInterval(applySchedule, 20000);

  start();
  // a favourites link opened in a tab that already has the app
  window.addEventListener('hashchange', () => {
    const list = readImport(location.hash);
    if (!list) return;
    history.replaceState(null, '', current ? '#' + keyOf(current) : location.pathname + location.search);
    if (list.length) offerImport(list);
  });

  // Show the controls and cursor only while the pointer is moving
  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, wake, { passive: true }));

  // Keep the display from sleeping where the browser supports it
  async function stayAwake() {
    try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  stayAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) stayAwake(); });

  // Installable app: keep the page itself available offline
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});

  // Click the board to toggle fullscreen. On touch screens a tap only enters it, and only in
  // landscape (taps mostly just bring the controls back, and Android shows its "drag from the
  // top" notice on every entry); in portrait the status bar stays.
  const touch = matchMedia('(pointer: coarse)').matches;
  document.addEventListener('click', e => {
    if (e.target.closest('button, dialog, input, .chrome')) return;
    if (touch) {
      // phones: a tap in landscape goes full screen; portrait keeps the status bar
      if (!board.portrait && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
      return;
    }
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(() => {});
  });
})();
</script>
</body>
